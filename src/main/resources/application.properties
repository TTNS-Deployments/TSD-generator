server.port=${PORT:8080}

# Gemini (D1 only). The key comes from the GEMINI_API_KEY environment variable / app setting. Never put it in this file.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

template.path=templates/AVD_TSD-V1_0.docx
prompt.path=prompts/avd_system_prompt.txt
temp.path=temp/

# D2 templates (one .docx per D2 type)
d2.template.dir=templates/D2

# BOQ uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
